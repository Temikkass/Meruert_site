name: CI

# Runs the same four checks as `npm run verify`, on every push and PR.
# `next build` is included deliberately and is not redundant with `tsc`:
# typedRoutes generates its route-literal union at build time, so a typo'd
# href is only caught here.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      # next/font/google downloads and self-hosts the three families at build
      # time, so this step needs network egress to fonts.googleapis.com.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
